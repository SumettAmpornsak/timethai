<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <title>แสดงเวลาปัจจุบันของประเทศไทย</title>
  <link rel="icon" href="../img/clock time thai.png" type="image/x-icon" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: "Kanit", sans-serif;
      font-weight: 300;
      transition: background-color 0.3s, color 0.5s;
    }

    body {
      flex: 1;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 3em;
      text-align: center;
    }

    #current-time {
      font-size: 5em;
      font-weight: bold;
    }

    #current-date {
      font-size: 2em;
    }

    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }

    .light-mode {
      background-color: #ffffff;
      color: #000000;
    }

    .theme-toggle,
    .fullscreen-toggle {
      margin: 10px 5px;
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      transition: background-color 0.3s, color 0.3s;
    }

    .theme-toggle.dark-mode,
    .fullscreen-toggle.dark-mode {
      background-color: #ffffff;
      color: #000000;
    }

    .theme-toggle.light-mode,
    .fullscreen-toggle.light-mode {
      background-color: #121212;
      color: #ffffff;
    }

    #container {
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 50px;
      padding: 20px;
      display: inline-block;
      text-align: center;
      transition: color 0.9s;
    }

    #container:hover {
      color: hsl(158, 95%, 34%);
      cursor: pointer;
    }

    footer {
      width: 100%;
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 10px 0;
      position: fixed;
      bottom: 0;
    }

    footer a {
      color: #007bff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body class="light-mode">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="index.html">Time in Thailand by Sumett Ampornsak</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active">
          <a class="nav-link" href="index.html">หน้าหลัก</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="settings.html">ตั้งค่า</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">ติดต่อ</a>
        </li>
      </ul>
    </div>
  </nav>

  <div id="container" class="container mt-4">
    <h1>เวลาปัจจุบันของประเทศไทย</h1>
    <p id="current-time"></p>
    <p id="current-date"></p>
    <button class="btn btn-light theme-toggle" onclick="toggleTheme()">
      <i class="fas fa-adjust"></i> Select Mode
    </button>
    <button class="btn btn-light fullscreen-toggle" onclick="toggleFullScreen()">
      <i class="fas fa-expand"></i> Full Screen
    </button>
  </div>

  <footer>
    <p>&copy; Sumett Ampornsak 2024</p>
    <p>
      <a href="mailto:Sumett13ampornsak@gmail.com">Sumett13ampornsak@gmail.com</a>
    </p>
  </footer>

  <script>
    function displayBangkokTime() {
      const bangkokTime = new Date().toLocaleString("th-TH", {
        timeZone: "Asia/Bangkok",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });

      // แยกวันที่กับเวลาออกจากกัน
      const parts = bangkokTime.split(" ");
      // รูปแบบ: วันเดือนปี เวลา เช่น "วันศุกร์ที่ 24 พฤษภาคม 2567 14:30:15"
      // โดยทั่วไป parts จะมีข้อมูลแบบนี้:
      // ["วันศุกร์ที่", "24", "พฤษภาคม", "2567", "14:30:15"]

      // หา index เวลา (อาจจะเป็นตัวสุดท้าย)
      const time = parts[parts.length - 1];
      // เอาวันที่ออกมาโดย join ส่วนก่อนหน้า
      const date = parts.slice(0, parts.length - 1).join(" ");

      document.getElementById("current-time").textContent = time;
      document.getElementById("current-date").textContent = date;

      document.title = `เวลาตอนนี้ ${time}`;
    }

    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.querySelector(".theme-toggle");
      const fullBtn = document.querySelector(".fullscreen-toggle");
      const isLight = body.classList.contains("light-mode");

      body.classList.toggle("light-mode", !isLight);
      body.classList.toggle("dark-mode", isLight);
      themeBtn.classList.toggle("light-mode", !isLight);
      themeBtn.classList.toggle("dark-mode", isLight);
      fullBtn.classList.toggle("light-mode", !isLight);
      fullBtn.classList.toggle("dark-mode", isLight);
      themeBtn.innerHTML = isLight ?
        '<i class="fas fa-sun"></i> Light Mode' :
        '<i class="fas fa-moon"></i> Dark Mode';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    window.onload = function () {
      const fontSize = localStorage.getItem("fontSize") || "16px";
      const bgColor = localStorage.getItem("bgColor") || "#ffffff";
      const fontFamily = localStorage.getItem("fontFamily") || "'Kanit', sans-serif";
      document.body.style.fontSize = fontSize;
      document.body.style.backgroundColor = bgColor;
      document.body.style.fontFamily = fontFamily;
    };

    displayBangkokTime();
    setInterval(displayBangkokTime, 1000);
  </script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
