<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <title>แสดงเวลาปัจจุบันของประเทศไทย</title>
  <link rel="icon" href="../img/clock time thai.png" type="image/x-icon" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: "Kanit", sans-serif;
      font-weight: 300;
      transition: background-color 0.3s, color 0.5s;
    }

    body {
      flex: 1;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 3em;
      text-align: center;
    }

    #current-time {
      font-size: 5em;
      font-weight: bold;
    }

    #current-date {
      font-size: 2em;
    }

    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }

    .light-mode {
      background-color: #ffffff;
      color: #000000;
    }

    .theme-toggle, .fullscreen-toggle {
      margin: 10px 5px;
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      transition: background-color 0.3s, color 0.3s;
    }

    .theme-toggle.dark-mode,
    .fullscreen-toggle.dark-mode {
      background-color: #ffffff;
      color: #000000;
    }

    .theme-toggle.light-mode,
    .fullscreen-toggle.light-mode {
      background-color: #121212;
      color: #ffffff;
    }

    #container {
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 50px;
      padding: 20px;
      display: inline-block;
      text-align: center;
      transition: color 0.9s;
    }

    #container:hover {
      color: hsl(158, 95%, 34%);
      cursor: pointer;
    }

    footer {
      width: 100%;
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 10px 0;
      position: fixed;
      bottom: 0;
    }

    footer a {
      color: #007bff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body class="light-mode">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="index.html">Time in Thailand by Sumett Ampornsak</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active">
          <a class="nav-link" href="index.html">หน้าหลัก</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="settings.html">ตั้งค่า</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">ติดต่อ</a>
        </li>
      </ul>
    </div>
  </nav>

  <div id="container" class="container mt-4">
    <h1>เวลาปัจจุบันของประเทศไทย</h1>
    <p id="current-time"></p>
    <p id="current-date"></p>
    <button class="btn btn-light theme-toggle" onclick="toggleTheme()">
      <i class="fas fa-adjust"></i> Select Mode
    </button>
    <button class="btn btn-light fullscreen-toggle" onclick="toggleFullScreen()">
      <i class="fas fa-expand"></i> Full Screen
    </button>
  </div>

  <footer>
      <p>&copy; Sumett Ampornsak 2024</p>
      <p>
        <a href="mailto:Sumett13ampornsak@gmail.com"
          >Sumett13ampornsak@gmail.com</a
        >
      </p>
    </footer>

  <script>
    function displayServerTime() {
      fetch("https://timeapi.io/api/Time/current/zone?timeZone=Asia/Bangkok")
        .then((response) => response.json())
        .then((data) => {
          const dateTime = new Date(data.year, data.month - 1, data.day, data.hour, data.minute, data.seconds);

          const timeHtml = `<span class="hour">${data.hour}</span>:<span class="minute">${data.minute.toString().padStart(2, '0')}</span>:<span class="second">${data.seconds.toString().padStart(2, '0')}</span>`;
          document.getElementById("current-time").innerHTML = timeHtml;

          const thaiDate = dateTime.toLocaleDateString("th-TH", {
            weekday: "long", year: "numeric", month: "long", day: "numeric"
          });
          document.getElementById("current-date").textContent = `${thaiDate} (สัปดาห์ที่ ${getWeekNumber(dateTime)})`;

          document.title = `เวลาตอนนี้ ${data.hour}:${data.minute}`;
        })
        .catch((error) => {
          console.error("Error fetching time:", error);
        });
    }

    function getWeekNumber(date) {
      const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
      const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
      return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
    }

    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.querySelector(".theme-toggle");
      const fullBtn = document.querySelector(".fullscreen-toggle");
      const isLight = body.classList.contains("light-mode");

      body.classList.toggle("light-mode", !isLight);
      body.classList.toggle("dark-mode", isLight);
      themeBtn.classList.toggle("light-mode", !isLight);
      themeBtn.classList.toggle("dark-mode", isLight);
      fullBtn.classList.toggle("light-mode", !isLight);
      fullBtn.classList.toggle("dark-mode", isLight);
      themeBtn.innerHTML = isLight
        ? '<i class="fas fa-sun"></i> Light Mode'
        : '<i class="fas fa-moon"></i> Dark Mode';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    window.onload = function () {
      const fontSize = localStorage.getItem("fontSize") || "16px";
      const bgColor = localStorage.getItem("bgColor") || "#ffffff";
      const fontFamily = localStorage.getItem("fontFamily") || "'Kanit', sans-serif";
      document.body.style.fontSize = fontSize;
      document.body.style.backgroundColor = bgColor;
      document.body.style.fontFamily = fontFamily;
    };

    displayServerTime();
    setInterval(displayServerTime, 1000);
  </script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
